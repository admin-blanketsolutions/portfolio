name: audit-platform

on:
  push:
    paths: ['audit-platform/**', '.github/workflows/audit-platform-ci.yml']
  pull_request:
    paths: ['audit-platform/**', '.github/workflows/audit-platform-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: audit-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit-platform/backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: audit-platform/parser/requirements-dev.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: TB parser (sandboxed) — unit, property and malicious-file tests
        working-directory: audit-platform/parser
        # The backend's integration tests spawn this venv's interpreter (TB_PARSER_DIR default).
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m pytest
      - name: SQL migrations + security test suites
        id: sql
        env:
          ADMIN_URL: postgresql://postgres@localhost:5432/postgres
          KEEP_DB: '1'
        run: |
          ./db/scripts/test.sh | tee sql.log
          echo "db=$(grep '^DATABASE_URL=' sql.log | cut -d= -f2 | xargs basename)" >> "$GITHUB_OUTPUT"
      - name: Backend typecheck
        working-directory: audit-platform/backend
        run: npm ci && npm run typecheck
      - name: S3 emulator (moto) for the object-store adapter tests
        run: |
          python -m venv /tmp/moto && /tmp/moto/bin/pip install "moto[server]==5.2.3"
          (/tmp/moto/bin/moto_server -H 127.0.0.1 -p 4566 > /tmp/moto.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4566 >/dev/null && break; sleep 1; done
      - name: Backend unit + integration + HTTP e2e tests (+ S3 adapter against moto)
        working-directory: audit-platform/backend
        env:
          ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/${{ steps.sql.outputs.db }}
          DATABASE_URL: postgresql://audit_app_it:it-only@localhost:5432/${{ steps.sql.outputs.db }}
          S3_TEST_ENDPOINT: http://127.0.0.1:4566
        run: npm test

  # Every TB file parsed inside the network-less container, plus the isolation probes.
  sandbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: audit-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit-platform/backend/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build the parser image
        run: docker build -t audit-tb-parser:ci parser
      - name: Fresh database with fixtures
        id: sql
        env:
          ADMIN_URL: postgresql://postgres@localhost:5432/postgres
          KEEP_DB: '1'
        run: |
          ./db/scripts/test.sh | tee sql.log
          echo "db=$(grep '^DATABASE_URL=' sql.log | cut -d= -f2 | xargs basename)" >> "$GITHUB_OUTPUT"
      - name: Isolation probes + TB end-to-end through the container parser
        working-directory: audit-platform/backend
        env:
          ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/${{ steps.sql.outputs.db }}
          DATABASE_URL: postgresql://audit_app_it:it-only@localhost:5432/${{ steps.sql.outputs.db }}
          TB_PARSER_DRIVER: container
          TB_PARSER_IMAGE: audit-tb-parser:ci
        run: |
          npm ci
          npx vitest run test/integration/container-parser.test.ts test/integration/tb-ingestion-e2e.test.ts

  # Sign-in against a real IdP (Keycloak over TLS), the real API and a test database.
  idp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: audit-platform
    env:
      TEST_IDP_DIR: /tmp/audit-test-idp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start the test IdP (Keycloak, https://localhost:8443)
        run: ./idp/keycloak/start-test-idp.sh "$TEST_IDP_DIR"
      - name: Fresh database with fixtures
        id: sql
        env:
          ADMIN_URL: postgresql://postgres@localhost:5432/postgres
          KEEP_DB: '1'
        run: |
          ./db/scripts/test.sh | tee sql.log
          echo "db=$(grep '^DATABASE_URL=' sql.log | cut -d= -f2 | xargs basename)" >> "$GITHUB_OUTPUT"
      - name: Build the API
        working-directory: audit-platform/backend
        run: npm ci && npm run build
      - name: Install the web app and Chromium
        working-directory: audit-platform/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Real sign-in browser tests
        working-directory: audit-platform/web
        env:
          ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/${{ steps.sql.outputs.db }}
          DATABASE_URL: postgresql://audit_app_it:it-only@localhost:5432/${{ steps.sql.outputs.db }}
        run: npm run test:idp
      - name: IdP logs on failure
        if: failure()
        run: docker logs --tail 200 audit-test-idp

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit-platform/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Component tests (vitest + Testing Library)
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests (production build, strict CSP, mocked API)
        run: npm run test:e2e
